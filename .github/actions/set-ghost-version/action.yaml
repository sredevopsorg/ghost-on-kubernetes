name: "Set Ghost Version"
description: "Sets up GHOST_VERSION, GHOST_TARBALL_SHA256, and MANUAL_TAG values based on event type"
inputs:
  event-name:
    description: "The GitHub event name"
    required: true
  ghost-version:
    description: "Ghost version from workflow_dispatch inputs"
    required: true
  manual-tag:
    description: "Manual tag from workflow_dispatch inputs"
    required: false
outputs:
  ghost-version:
    description: "The Ghost version to use"
    value: ${{ steps.version-setter.outputs.GHOST_VERSION }}
  manual-tag:
    description: "The manual tag value"
    value: ${{ steps.version-setter.outputs.MANUAL_TAG }}
  ghost-tarball-sha256:
    description: "The SHA256 hash of the Ghost tarball"
    value: ${{ steps.version-setter.outputs.GHOST_TARBALL_SHA256 }}
runs:
  using: "composite"
  steps:
    - name: Set up GHOST_VERSION and MANUAL_TAG values
      shell: bash
      id: version-setter
      env:
        GITHUB_EVENT_NAME: ${{ inputs.event-name }}
      run: |
        if [ "${{ env.GITHUB_EVENT_NAME }}" == "workflow_dispatch" ]; then
          echo "GHOST_VERSION=$(curl -s https://api.github.com/repos/tryghost/ghost/releases/latest | jq '.name' | sed 's/\"//g' | sed 's/^v//')" >> $GITHUB_OUTPUT
          echo "GHOST_TARBALL_SHA256=$(curl -s https://api.github.com/repos/tryghost/ghost/releases/latest | jq -r '.assets[] | select(.digest != null) | .digest' | head -n 1 | sed 's/^sha256://')" >> "$GITHUB_OUTPUT"
          echo "MANUAL_TAG=${{ inputs.manual-tag }}" >> $GITHUB_OUTPUT
        else
          echo "GHOST_VERSION=$(curl -s https://api.github.com/repos/tryghost/ghost/releases/latest | jq '.name' | sed 's/\"//g' | sed 's/^v//')" >> $GITHUB_OUTPUT
          echo "GHOST_TARBALL_SHA256=$(curl -s https://api.github.com/repos/tryghost/ghost/releases/latest | jq -r '.assets[] | select(.digest != null) | .digest' | head -n 1 | sed 's/^sha256://')" >> "$GITHUB_OUTPUT"
        fi

    - name: Show Ghost version
      shell: bash
      continue-on-error: true
      run: |
        echo "output of step for GHOST_VERSION=${{ steps.version-setter.outputs.GHOST_VERSION }}"
        echo "output of step for GHOST_TARBALL_SHA256=${{ steps.version-setter.outputs.GHOST_TARBALL_SHA256 }}"
        echo "output of step for MANUAL_TAG=${{ steps.version-setter.outputs.MANUAL_TAG }}"
