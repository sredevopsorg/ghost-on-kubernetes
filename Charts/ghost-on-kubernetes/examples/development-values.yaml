# development-values.yaml
# Local development: smallest useful footprint, no ingress, no TLS.

replicaCount: 1

image:
  repository: ghcr.io/sredevopsorg/ghost-on-kubernetes
  tag: "latest-dev" # Development image with SQLite support
  pullPolicy: Always

ghost:
  url: "http://localhost:2368"
  adminUrl: "http://localhost:2368"

  mail:
    enabled: false

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Nothing to probe before the site is set up.
  startupProbe:
    enabled: false
  readinessProbe:
    enabled: false
  livenessProbe:
    enabled: false

mysql:
  enabled: true

  auth:
    database: "ghost_dev"
    username: "ghost"
    password: "ghost"
    rootPassword: "root"

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

persistence:
  ghost:
    enabled: true
    storageClassName: "longhorn"
    accessMode: ReadWriteOnce
    size: 1Gi

  mysql:
    enabled: true
    storageClassName: "longhorn"
    accessMode: ReadWriteOnce
    size: 1Gi

# Ephemeral is the point in development: no claims to clean up on every reset.
strategy:
  type: Recreate

ingress:
  enabled: false
