# manual-tls-values.yaml
# Ingress with a certificate you supply yourself.

ghost:
  url: "https://secure.example.com"
  adminUrl: "https://secure.example.com"

mysql:
  enabled: true

  auth:
    database: "ghost_secure"
    username: "ghost_secure_user"
    password: "SecureDatabasePassword123!"
    rootPassword: "SecureRootPassword123!"

persistence:
  ghost:
    enabled: true
    storageClassName: "fast-storage"
    accessMode: ReadWriteOnce
    size: 5Gi

  mysql:
    enabled: true
    storageClassName: "fast-storage"
    accessMode: ReadWriteOnce
    size: 10Gi

ingress:
  enabled: true
  className: "traefik"
  preset: "traefik"

  hosts:
    - host: secure.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific

  tls:
    enabled: true
    # "manual" points the Ingress at secretName. Create the secret yourself with
    # kubectl, or set certificate and key below and let the chart create it.
    mode: "manual"
    secretName: "manual-tls-secret"
    certificate: ""
    key: ""
    hosts:
      - secure.example.com
