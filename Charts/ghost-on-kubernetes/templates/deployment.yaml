apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ghost-on-kubernetes.fullname" . }}
  labels:
    {{- include "ghost-on-kubernetes.labels" . | nindent 4 }}
    app.kubernetes.io/component: ghost
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ghost-on-kubernetes.selectorLabels" . | nindent 6 }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "ghost-on-kubernetes.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ghost
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secret-ghost-config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- range . }}
      - name: {{ .name | quote }}
      {{- end }}
      {{- end }}
      serviceAccountName: {{ include "ghost-on-kubernetes.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      volumes:
      - name: ghost-content
        {{- if .Values.persistence.ghost.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "ghost-on-kubernetes.fullname" . }}-content
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: ghost-config
        secret:
          secretName: {{ .Values.ghost.config.existingSecret | default (printf "%s-config" (include "ghost-on-kubernetes.fullname" .)) }}
          defaultMode: 420
      - name: tmp
        emptyDir:
          sizeLimit: {{ .Values.volumes.tmp.sizeLimit | quote }}
      {{- with .Values.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if .Values.ghost.initContainer.enabled }}
      initContainers:
      - name: permissions-fix
        imagePullPolicy: {{ .Values.initContainer.image.pullPolicy | quote }}
        image: "{{ .Values.initContainer.image.repository }}:{{ .Values.initContainer.image.tag }}"
        env:
        - name: GHOST_INSTALL
          value: /home/nonroot/app/ghost
        - name: GHOST_CONTENT
          value: {{ .Values.ghost.contentPath | quote }}
        - name: NODE_ENV
          value: production
        securityContext:
          {{- toYaml .Values.initContainer.securityContext | nindent 10 }}
        resources:
          {{- toYaml .Values.initContainer.resources | nindent 10 }}
        command:
          - /bin/sh
          - '-c'
          - |
            set -e
            export DIRS='files logs apps themes data public settings images media'
            echo 'Check if base dirs exists, if not, create them'
            echo "Directories to check: $DIRS"
            for dir in $DIRS; do
              if [ ! -d $GHOST_CONTENT/$dir ]; then
                echo "Creating $GHOST_CONTENT/$dir directory"
                mkdir -pv $GHOST_CONTENT/$dir || echo "Error creating $GHOST_CONTENT/$dir directory"
              fi
              chown -Rfv 65532:65532 $GHOST_CONTENT/$dir && echo "chown ok on $dir" || echo "Error changing ownership of $GHOST_CONTENT/$dir directory"
            done
            exit 0
        volumeMounts:
        - name: ghost-content
          mountPath: {{ .Values.ghost.contentPath | quote }}
          readOnly: false
      {{- end }}
      containers:
      - name: ghost
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
        ports:
        - name: ghk8s
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        {{- if .Values.ghost.readinessProbe.enabled }}
        readinessProbe:
          {{- include "ghost-on-kubernetes.probe" (dict "root" . "probe" .Values.ghost.readinessProbe) | nindent 10 }}
        {{- end }}
        {{- if .Values.ghost.livenessProbe.enabled }}
        livenessProbe:
          {{- include "ghost-on-kubernetes.probe" (dict "root" . "probe" .Values.ghost.livenessProbe) | nindent 10 }}
        {{- end }}
        {{- if .Values.ghost.startupProbe.enabled }}
        startupProbe:
          {{- include "ghost-on-kubernetes.probe" (dict "root" . "probe" .Values.ghost.startupProbe) | nindent 10 }}
        {{- end }}
        env:
        - name: NODE_ENV
          value: production
        {{- if and .Values.valkey.enabled .Values.valkey.auth.enabled }}
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "ghost-on-kubernetes.valkey.secretName" . }}
              key: valkey-password
        {{- end }}
        {{- with .Values.ghost.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.extraEnvFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        resources:
          {{- toYaml .Values.ghost.resources | nindent 10 }}
        volumeMounts:
        - name: ghost-content
          mountPath: {{ .Values.ghost.contentPath | quote }}
          readOnly: false
        - name: ghost-config
          readOnly: true
          mountPath: /home/nonroot/app/ghost/config.production.json
          subPath: config.production.json
        - name: tmp
          mountPath: /tmp
          readOnly: false
        {{- with .Values.ghost.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        securityContext:
          {{- toYaml .Values.ghost.securityContext | nindent 10 }}
      restartPolicy: Always
      terminationGracePeriodSeconds: {{ .Values.ghost.terminationGracePeriodSeconds }}
      dnsPolicy: ClusterFirst
      {{- with (include "ghost-on-kubernetes.affinity" .Values.ghost.affinity | fromYaml) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ghost.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ghost.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ghost.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
