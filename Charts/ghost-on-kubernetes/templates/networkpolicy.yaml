{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ghost-on-kubernetes.fullname" . }}
  labels:
    {{- include "ghost-on-kubernetes.labels" . | nindent 4 }}
    app.kubernetes.io/component: ghost
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "ghost-on-kubernetes.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
  - ports:
    - protocol: TCP
      port: {{ .Values.service.targetPort }}
  egress:
  # DNS to the cluster resolver.
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  {{- if .Values.mysql.enabled }}
  # Bundled MySQL.
  - ports:
    - protocol: TCP
      port: {{ .Values.mysql.containerPort }}
  {{- end }}
  {{- if .Values.valkey.enabled }}
  # Bundled Valkey.
  - ports:
    - protocol: TCP
      port: {{ .Values.valkey.containerPort }}
  {{- end }}
  {{- with .Values.networkPolicy.egress }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
