{{- if not .Values.ghost.config.existingSecret }}
{{- $fullname := include "ghost-on-kubernetes.fullname" . }}
{{- $config := dict
  "url" .Values.ghost.url
  "admin" (dict "url" (.Values.ghost.adminUrl | default .Values.ghost.url))
  "server" (dict "port" (.Values.service.targetPort | int) "host" "0.0.0.0")
  "logging" (dict "transports" (list "stdout"))
  "process" "local"
  "paths" (dict "contentPath" .Values.ghost.contentPath)
-}}
{{- if .Values.ghost.mail.enabled }}
{{- $_ := set $config "mail" (dict
  "transport" .Values.ghost.mail.transport
  "from" .Values.ghost.mail.from
  "options" (dict
    "service" .Values.ghost.mail.service
    "host" .Values.ghost.mail.host
    "port" (.Values.ghost.mail.port | int)
    "secure" .Values.ghost.mail.secure
    "auth" (dict "user" .Values.ghost.mail.user "pass" .Values.ghost.mail.password)
  )
) }}
{{- end }}
{{- $database := include "ghost-on-kubernetes.databaseConfig" . | fromYaml }}
{{- $_ := set $config "database" $database }}
{{- $adapters := include "ghost-on-kubernetes.cacheConfig" . | fromYaml }}
{{- if $adapters }}
{{- $_ := set $config "hostSettings" (dict
  "postsPublicCache" (dict "enabled" true)
  "linkRedirectsPublicCache" (dict "enabled" true)
  "tagsPublicCache" (dict "enabled" true)
  "statsCache" (dict "enabled" true)
) }}
{{- $_ := set $config "adapters" $adapters }}
{{- end }}
{{- with .Values.ghost.extraConfig }}
{{- $_ := mergeOverwrite $config (deepCopy .) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-config
  labels:
    {{- include "ghost-on-kubernetes.labels" . | nindent 4 }}
    app.kubernetes.io/component: ghost-config
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  config.production.json: |-
    {{- $config | toPrettyJson | nindent 4 }}
{{- end }}
