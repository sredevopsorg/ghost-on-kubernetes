{{- if and .Values.valkey.enabled .Values.valkey.auth.enabled (not .Values.valkey.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ghost-on-kubernetes.valkey.secretName" . }}
  labels:
    {{- include "ghost-on-kubernetes.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache-secret
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  valkey-password: {{ required "valkey.auth.password is required, or set valkey.auth.existingSecret" .Values.valkey.auth.password | quote }}
{{- end }}
