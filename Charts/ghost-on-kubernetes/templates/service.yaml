apiVersion: v1
kind: Service
metadata:
  name: {{ include "ghost-on-kubernetes.fullname" . }}-service
  labels:
    {{- include "ghost-on-kubernetes.labels" . | nindent 4 }}
    app.kubernetes.io/component: service-frontend
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ports:
  - port: {{ .Values.service.port }}
    protocol: TCP
    targetPort: ghk8s
    name: ghk8s
  type: {{ .Values.service.type | quote }}
  selector:
    {{- include "ghost-on-kubernetes.selectorLabels" . | nindent 4 }}
{{- if .Values.mysql.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ghost-on-kubernetes.fullname" . }}-mysql-service
  labels:
    {{- include "ghost-on-kubernetes.labels" . | nindent 4 }}
    app.kubernetes.io/component: service-database
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ports:
  - port: {{ .Values.service.mysql.port }}
    protocol: TCP
    targetPort: mysqlgh
    name: mysqlgh
  # Governing service of the MySQL StatefulSet: always headless, so the type
  # stays ClusterIP and no load balancer or node port is created for the database.
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "ghost-on-kubernetes.mysql.selectorLabels" . | nindent 4 }}
{{- end }}
{{- if .Values.valkey.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ghost-on-kubernetes.fullname" . }}-valkey-service
  labels:
    {{- include "ghost-on-kubernetes.labels" . | nindent 4 }}
    app.kubernetes.io/component: service-cache
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ports:
  - port: {{ .Values.service.valkey.port }}
    protocol: TCP
    targetPort: valkey
    name: valkey
  # Headless for the same reason as MySQL: Valkey is cluster-internal only.
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "ghost-on-kubernetes.valkey.selectorLabels" . | nindent 4 }}
{{- end }}
