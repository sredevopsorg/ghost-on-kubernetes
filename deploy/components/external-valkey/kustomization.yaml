apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# OPTIONAL component: replace the in-cluster Valkey cache with an external
# Valkey/Redis server. It deletes the Valkey Secret, Deployment, Service and
# PVC and points Ghost at placeholders you must replace.
#
#   components:
#     - ../../components/external-valkey
#
# NOTE: this rewrites the whole stringData["config.production.json"] value, so
# it cannot be combined with components/external-mysql in one overlay. Use
# deploy/overlays/external-services when both services are external.

patches:
# ---- remove the in-cluster Valkey workload ----
  - target: {kind: Deployment, name: ghost-on-kubernetes-valkey}
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ghost-on-kubernetes-valkey
  - target: {kind: Service, name: ghost-on-kubernetes-valkey-service}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: ghost-on-kubernetes-valkey-service
  - target: {kind: PersistentVolumeClaim, name: ghost-on-kubernetes-valkey-pvc}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: ghost-on-kubernetes-valkey-pvc
  - target: {kind: Secret, name: ghost-on-kubernetes-valkey-env}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: ghost-on-kubernetes-valkey-env

  - path: ghost-config-patch.yaml
