apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Default entry point so that `kubectl apply -k deploy/` keeps working the
# same way the manual `kubectl apply -f deploy/*.yaml` sequence used to.
#
# For environment specific deployments use one of the overlays instead:
#   kubectl apply -k deploy/overlays/development
#   kubectl apply -k deploy/overlays/production

resources:
  - base
